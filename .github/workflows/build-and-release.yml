name: Build and Release Nexo TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        run: |
          # Mismo keystore de desarrollo (android/android) para que todas las APKs se puedan actualizar entre sí
          echo "" | base64 -d > debug.keystore
          ls -la debug.keystore

      - name: Compute version
        id: ver
        run: |
          CODE=$((2000 + ${{ github.run_number }}))
          NAME="2.2.$((40 + ${{ github.run_number }}))"
          TAG="v$NAME"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cat > version.json <<EOF
          {
            "versionCode": $CODE,
            "versionName": "$NAME",
            "apkUrl": "https://github.com/pjaraf/nexo-plus/releases/download/$TAG/app-release.apk",
            "changelog": "Actualización automática Nexo TV $NAME",
            "mandatory": false
          }
          EOF
          # Patch app version for this build
          sed -i "s/versionCode = [0-9]*/versionCode = $CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$NAME\"/" app/build.gradle.kts
          cat version.json
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          NAME="${{ steps.ver.outputs.version_name }}"
          CODE="${{ steps.ver.outputs.version_code }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" app-release.apk
          # version.json en la raíz del release para que la app lo lea
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app-release.apk version.json --clobber
          else
            gh release create "$TAG" app-release.apk version.json \
              --title "Nexo TV $NAME" \
              --notes "Build automático #$CODE — cada push a main publica esta APK para actualizar todos los dispositivos."
          fi
          # Mantener también version.json en main como apuntador estable
          echo "Release published: https://github.com/pjaraf/nexo-plus/releases/tag/$TAG"
